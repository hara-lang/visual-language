<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4096 2304" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Hara symbol lattice</title>
  <desc id="desc">A repeatable lattice of Hara marks and register-like lines creates a quiet symbolic texture for large surfaces.</desc>
  <defs>
    <linearGradient id="spectrum" x1="280" y1="220" x2="3820" y2="2100" gradientUnits="userSpaceOnUse"><stop stop-color="#27B8B0"/><stop offset=".5" stop-color="#2F7CFF"/><stop offset="1" stop-color="#7957D5"/></linearGradient>
    <pattern id="lattice" width="512" height="384" patternUnits="userSpaceOnUse">
      <path d="M0 0H512V384H0Z" fill="none" stroke="var(--grid)" stroke-width="2"/>
      <g transform="translate(184 96) scale(2.1)" opacity=".42"><path fill="var(--ink)" d="M10 8h13v18h18V8h13v48H41V38H23v18H10z"/><path fill="#2F7CFF" d="M27 8h10v10H27z"/></g>
      <path d="M42 326h184M42 348h118M332 42h138" stroke="var(--grid-strong)" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <radialGradient id="spot"><stop stop-color="#2F7CFF" stop-opacity=".18"/><stop offset=".55" stop-color="#27B8B0" stop-opacity=".05"/><stop offset="1" stop-color="#7957D5" stop-opacity="0"/></radialGradient>
    <style>:root{--ground:#f6f8fa;--ink:#11151a;--grid:rgba(24,31,38,.065);--grid-strong:rgba(24,31,38,.12)}@media(prefers-color-scheme:dark){:root{--ground:#050608;--ink:#f4f6f8;--grid:rgba(222,231,240,.055);--grid-strong:rgba(222,231,240,.11)}}</style>
  </defs>
  <rect width="4096" height="2304" fill="var(--ground)"/><rect width="4096" height="2304" fill="url(#lattice)"/><ellipse cx="2180" cy="1120" rx="1600" ry="980" fill="url(#spot)"/>
  <g fill="none" stroke="url(#spectrum)" stroke-linecap="round"><path d="M-120 1870C680 1410 1230 1820 1900 1340s1240-630 2310-40" stroke-width="16" opacity=".55"/><path d="M-120 1940C720 1530 1280 1910 1980 1420s1230-520 2230-10" stroke-width="4" opacity=".34"/></g>
  <g fill="var(--ground)" stroke="url(#spectrum)" stroke-width="7"><circle cx="820" cy="1580" r="16"/><circle cx="1510" cy="1620" r="16"/><circle cx="2190" cy="1240" r="18"/><circle cx="2870" cy="1080" r="16"/><circle cx="3530" cy="1240" r="18"/></g>
</svg>
