name: Complete issue 110 editorial sweep

on:
  push:
    branches:
      - agent/issue-110-technical-editorial-voice

permissions:
  contents: write

jobs:
  rewrite-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-110-technical-editorial-voice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact editorial replacements
        run: node scripts/run-editorial-copy.mjs
      - name: Validate package and public site
        run: |
          npm test
          npm run site:build
      - name: Commit the completed sweep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src scripts/editorial-copy.mjs
          if git diff --cached --quiet; then
            echo "No editorial replacements were required."
          else
            git commit -m "copy: complete the technical editorial sweep"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
