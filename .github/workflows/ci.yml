name: Validate visual language

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply issue 110 editorial migration
        if: github.head_ref == 'agent/issue-110-technical-editorial-voice'
        run: node scripts/run-editorial-copy.mjs
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/issue-110-test.log
          status=${PIPESTATUS[0]}
          awk '
            /^# Subtest:/ { subtest=$0 }
            /^not ok / { print subtest; print; failed=1; next }
            failed && /TestContext\.<anonymous>/ { print; print ""; failed=0 }
          ' /tmp/issue-110-test.log > /tmp/issue-110-failures.log
          {
            echo '### Issue #110 failing assertions'
            echo
            echo '```text'
            cat /tmp/issue-110-failures.log
            echo
            tail -n 10 /tmp/issue-110-test.log
            echo '```'
          } > /tmp/issue-110-test-comment.md
          exit "$status"
      - name: Report issue 110 test failure
        if: failure() && github.event_name == 'pull_request' && github.head_ref == 'agent/issue-110-technical-editorial-voice'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/issue-110-test-comment.md
      - run: npm run site:build
      - name: Commit validated editorial changes
        if: github.head_ref == 'agent/issue-110-technical-editorial-voice'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src scripts/editorial-copy.mjs
          if git diff --cached --quiet; then
            echo "No editorial replacements were required."
          else
            git commit -m "copy: complete the technical editorial sweep"
            git push origin HEAD:${{ github.head_ref }}
          fi