name: Validate visual language

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-ui
          ref: main
          path: hara-ui
      - name: Link Hara UI workspace path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../technology"
          ln -sfn "$GITHUB_WORKSPACE/hara-ui" "$GITHUB_WORKSPACE/../../technology/hara-ui"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run site:build
