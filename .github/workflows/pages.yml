name: Publish visual language
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-ui
          ref: main
          path: hara-ui
      - name: Link Hara UI workspace path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../technology"
          ln -sfn "$GITHUB_WORKSPACE/hara-ui" "$GITHUB_WORKSPACE/../../technology/hara-ui"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run site:build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  reconcile-domain:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Reconcile ui.hara-lang.org
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"cname":"ui.hara-lang.org","build_type":"workflow"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
