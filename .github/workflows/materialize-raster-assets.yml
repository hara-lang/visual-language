name: Materialize 4K raster graphics

on:
  push:
    branches: [agent/v2-raster-backgrounds]
    paths:
      - "scripts/build-raster-graphics.mjs"
      - "assets/cinematic/raster/seeds/**"
      - "assets/cinematic/raster/library-overlay.tar.gz"
      - ".github/workflows/materialize-raster-assets.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-raster-backgrounds
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install raster library overlay
        run: tar -xzf assets/cinematic/raster/library-overlay.tar.gz -C .
      - name: Materialize high-resolution WebP masters
        run: FORCE_RASTER=1 node scripts/build-raster-graphics.mjs
      - name: Commit raster library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm assets/cinematic/raster/library-overlay.tar.gz
          git rm .github/workflows/materialize-raster-assets.yml
          git add -A
          git commit -m "Materialize 4K raster graphics [materialized]"
          git push origin HEAD:agent/v2-raster-backgrounds
